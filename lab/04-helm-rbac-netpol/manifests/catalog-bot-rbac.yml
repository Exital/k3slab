apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-bot
  namespace: platform-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-reader
  namespace: platform-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
# Intentionally broken: binds the wrong ServiceAccount name.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-reader
  namespace: platform-lab
subjects:
  - kind: ServiceAccount
    name: catalog-bot-wrong
    namespace: platform-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: catalog-reader
