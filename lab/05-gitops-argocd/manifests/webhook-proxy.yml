apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-webhook-proxy
  namespace: gitops-lab
data:
  proxy.py: |
    #!/usr/bin/env python3
    """Rewrite Gitea ROOT_URL hosts in webhook payloads to the in-cluster clone URL Argo watches."""
    from __future__ import annotations

    import hashlib
    import hmac
    import os
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    ARGO_URL = os.environ.get(
        "ARGO_WEBHOOK_URL",
        "http://argocd-server.argocd.svc.cluster.local/argocd/api/webhook",
    )
    REPL_FROM = os.environ.get("REPL_FROM", "http://localhost/gitea").encode()
    REPL_TO = os.environ.get(
        "REPL_TO",
        "http://gitea.gitops-lab.svc.cluster.local:3000",
    ).encode()
    SECRET = os.environ.get("WEBHOOK_SECRET", "k3slab-gitops-webhook").encode()

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self) -> None:  # noqa: N802
            length = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(length)
            body = body.replace(REPL_FROM, REPL_TO)
            # Gogs-compatible signature Argo CD expects after body rewrite.
            sig = hmac.new(SECRET, body, hashlib.sha256).hexdigest()

            req = urllib.request.Request(ARGO_URL, data=body, method="POST")
            for key, value in self.headers.items():
                lk = key.lower()
                if lk in ("content-length", "host", "transfer-encoding", "x-gogs-signature", "x-hub-signature-256", "x-gitea-signature"):
                    continue
                req.add_header(key, value)
            req.add_header("Content-Length", str(len(body)))
            req.add_header("X-Gogs-Signature", sig)
            # Ensure Argo treats this as a Gogs push even if Gitea sent only X-Gitea-Event.
            if not self.headers.get("X-Gogs-Event"):
                event = self.headers.get("X-Gitea-Event") or self.headers.get("X-GitHub-Event") or "push"
                req.add_header("X-Gogs-Event", event)

            try:
                with urllib.request.urlopen(req, timeout=30) as resp:
                    payload = resp.read()
                    self.send_response(resp.status)
                    self.end_headers()
                    self.wfile.write(payload)
            except urllib.error.HTTPError as err:
                payload = err.read()
                self.send_response(err.code)
                self.end_headers()
                self.wfile.write(payload)
            except Exception as err:  # noqa: BLE001 — lab proxy; surface failure to Gitea delivery log
                msg = str(err).encode()
                self.send_response(502)
                self.end_headers()
                self.wfile.write(msg)

        def log_message(self, fmt: str, *args) -> None:  # noqa: A003
            sys_stderr = __import__("sys").stderr
            sys_stderr.write("%s - %s\n" % (self.address_string(), fmt % args))

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-webhook-proxy
  namespace: gitops-lab
  labels:
    app: gitops-webhook-proxy
spec:
  selector:
    app: gitops-webhook-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-webhook-proxy
  namespace: gitops-lab
  labels:
    app: gitops-webhook-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-webhook-proxy
  template:
    metadata:
      labels:
        app: gitops-webhook-proxy
    spec:
      containers:
        - name: proxy
          image: docker.io/library/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/proxy.py"]
          env:
            - name: ARGO_WEBHOOK_URL
              value: http://argocd-server.argocd.svc.cluster.local/argocd/api/webhook
            - name: REPL_FROM
              value: http://localhost/gitea
            - name: REPL_TO
              value: http://gitea.gitops-lab.svc.cluster.local:3000
            - name: WEBHOOK_SECRET
              value: k3slab-gitops-webhook
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: gitops-webhook-proxy
            defaultMode: 0555
