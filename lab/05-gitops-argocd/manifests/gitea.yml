apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitops-lab
  labels:
    app: gitea
spec:
  # Headless: bypass kube-proxy ClusterIP (flaky after multi-lab resets in this lab image).
  # In-cluster clients (Argo repo-server) resolve DNS to the pod IP via CNI.
  clusterIP: None
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitops-lab
  labels:
    app: gitea
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:1.22.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Official image entrypoint keys off DISABLE_SSH (not GITEA__server__*).
            - name: DISABLE_SSH
              value: "true"
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__DOMAIN
              value: "localhost"
            - name: GITEA__server__ROOT_URL
              value: "http://localhost/gitea/"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            # Prefer IPv4 so kubelet probes (pod IPv4) always succeed.
            - name: GITEA__server__HTTP_ADDR
              value: "0.0.0.0"
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            - name: GITEA__server__START_SSH_SERVER
              value: "false"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
          # Probe localhost inside the pod (avoids flaky kubelet→pod IP after multi-lab resets).
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z 127.0.0.1 3000 2>/dev/null || wget -q --spider http://127.0.0.1:3000/ 2>/dev/null
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
