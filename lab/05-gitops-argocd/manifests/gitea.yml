apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitops-lab
  labels:
    app: gitea
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitops-lab
  labels:
    app: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:1.22.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__DOMAIN
              value: "localhost"
            - name: GITEA__server__ROOT_URL
              value: "http://localhost/gitea/"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            # Prefer IPv4 so kubelet probes (pod IPv4) always succeed.
            - name: GITEA__server__HTTP_ADDR
              value: "0.0.0.0"
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            # Default ALLOWED_HOST_LIST=external blocks ClusterIP webhooks (proxy → Argo).
            - name: GITEA__webhook__ALLOWED_HOST_LIST
              value: "gitops-webhook-proxy.gitops-lab.svc.cluster.local,argocd-server.argocd.svc.cluster.local,private,loopback"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
