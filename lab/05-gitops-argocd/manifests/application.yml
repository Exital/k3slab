apiVersion: v1
kind: Secret
metadata:
  name: gitea-demo-app-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: http://gitea.gitops-lab.svc.cluster.local:3000/gitops/demo-app.git
  username: gitops
  password: gitops123
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  annotations:
    lab.k3slab.io/ticket: PLATFORM-GITOPS-7
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Shown on the Application summary in the Argo CD UI (easier to find than raw annotations).
  info:
    - name: ticket
      value: PLATFORM-GITOPS-7
  source:
    repoURL: http://gitea.gitops-lab.svc.cluster.local:3000/gitops/demo-app.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-lab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
