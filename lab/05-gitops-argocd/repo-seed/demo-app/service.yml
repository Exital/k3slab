apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: gitops-lab
  labels:
    app: demo-app
spec:
  selector:
    # BUG (intentional): selector does not match Deployment pod labels (app: demo-app).
    # Fix this in Git and push — do not kubectl-edit the live Service as the source of truth.
    app: demo
  ports:
    - name: http
      port: 80
      targetPort: 80
