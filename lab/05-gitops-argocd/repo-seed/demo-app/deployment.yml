apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: gitops-lab
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo
          image: ghcr.io/exital/simple-ctf:0.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: CTF_RELAY_MODE
              value: active
            # App serves under /ctf — Traefik Ingress needs no strip-prefix middleware.
            - name: BASE_PATH
              value: /ctf
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
