apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-api-entrypoint
  namespace: incident-lab
data:
  check-and-start.sh: |
    #!/bin/sh
    set -e
    MODE=$(cat /config/mode 2>/dev/null || echo "")
    if [ "$MODE" != "active" ]; then
      echo "ERROR: API mode is '${MODE}' but must be 'active' (ConfigMap shop-api-config key mode)"
      exit 1
    fi
    TOKEN=$(cat /secret/token 2>/dev/null || echo "")
    if [ -z "$TOKEN" ]; then
      echo "ERROR: missing health token (Secret shop-api-secret key token)"
      exit 1
    fi
    mkdir -p /usr/share/nginx/html
    printf '%s' "$TOKEN" > /usr/share/nginx/html/health
    exec nginx -g 'daemon off;'
