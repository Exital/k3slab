apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-dashboard
  namespace: workloads-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-dashboard-reader
  namespace: workloads-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-dashboard-reader
  namespace: workloads-lab
subjects:
  - kind: ServiceAccount
    name: load-dashboard
    namespace: workloads-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: load-dashboard-reader
