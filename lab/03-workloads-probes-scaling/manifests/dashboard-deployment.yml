apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-dashboard
  namespace: workloads-lab
  labels:
    app: load-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-dashboard
  template:
    metadata:
      labels:
        app: load-dashboard
    spec:
      serviceAccountName: load-dashboard
      containers:
        - name: dashboard
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/app.py"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TARGET_DEPLOYMENT
              value: autoscale-api
            - name: TARGET_HPA
              value: autoscale-api
            - name: POD_LABEL_SELECTOR
              value: app=autoscale-api
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: load-dashboard-app
