apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: workloads-lab
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          command:
            - /bin/sh
            - -c
            - |
              # Fixed in-flight concurrency: keep N requests busy, wait for the
              # batch, then repeat. Fast hosts finish sooner and immediately start
              # the next batch (usage stays high vs a tiny CPU request). Slow hosts
              # never pile up more than N Apache workers (no OOM storm).
              N=3
              while true; do
                i=0
                while [ "$i" -lt "$N" ]; do
                  wget -q -O- http://autoscale-api >/dev/null &
                  i=$((i + 1))
                done
                wait
              done
