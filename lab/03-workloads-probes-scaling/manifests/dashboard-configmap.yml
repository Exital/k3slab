      <script>
        const history = { cpuTotal: [], cpuAvg: [], memAvg: [], replicas: [] };
        const snapshots = [];
        const HISTORY_SIZE = 90;
        const STEP_SIZE = 5;
        let liveMode = true;
        const slider = document.getElementById("timelineSlider");
        const timelineInfo = document.getElementById("timelineInfo");
        const liveBtn = document.getElementById("liveBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const normalizedBase = window.location.href.endsWith("/")
          ? window.location.href
          : `${window.location.href}/`;
        const apiUrl = new URL("api/metrics", normalizedBase).toString();

        function fmt(n, d=1) { return Number(n || 0).toFixed(d); }

        function seriesToPoints(values, maxY) {
          if (!values.length) return "";
          const w = 600;
          const h = 170;
          const step = values.length <= 1 ? 0 : w / (values.length - 1);
          return values.map((v, i) => {
            const x = i * step;
            const y = h - (Math.max(0, Math.min(maxY, v)) / maxY) * (h - 4) - 2;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          }).join(" ");
        }

        function drawCharts() {
          const cpuMax = Math.max(50, ...history.cpuTotal, ...history.cpuAvg);
          const mixedMax = Math.max(20, ...history.memAvg, ...history.replicas.map((r) => r * 40));
          document.getElementById("cpuTotalLine").setAttribute("points", seriesToPoints(history.cpuTotal, cpuMax));
          document.getElementById("cpuAvgLine").setAttribute("points", seriesToPoints(history.cpuAvg, cpuMax));
          document.getElementById("memAvgLine").setAttribute("points", seriesToPoints(history.memAvg, mixedMax));
          document.getElementById("replicaLine").setAttribute(
            "points",
            seriesToPoints(history.replicas.map((r) => r * 40), mixedMax),
          );
        }

        function setLive(enabled) {
          liveMode = enabled;
          if (enabled) {
            liveBtn.classList.add("active");
            slider.value = String(Math.max(0, snapshots.length - 1));
          } else {
            liveBtn.classList.remove("active");
          }
        }

        function renderSnapshot(index) {
          if (!snapshots.length) return;
          const idx = Math.max(0, Math.min(index, snapshots.length - 1));
          const m = snapshots[idx];
          const currentReplicas = Number(m.hpa.currentReplicas || 0);
          const cpuTotal = Number(m.cpuTotalMillicores || 0);
          document.getElementById('replicas').textContent =
            `${m.deployment.readyReplicas || 0} / ${m.deployment.replicas || 0}`;
          document.getElementById('desired').textContent =
            `${m.hpa.currentReplicas || 0} / ${m.hpa.desiredReplicas || 0}`;
          document.getElementById('cpuTotal').textContent = `${cpuTotal} m`;
          document.getElementById('cpuAvg').textContent = `${fmt(m.cpuAverageMillicoresPerPod)} m`;
          document.getElementById('memTotal').textContent = `${fmt(m.memoryTotalMiB)} Mi`;
          document.getElementById('memAvg').textContent = `${fmt(m.memoryAverageMiBPerPod)} Mi`;
          document.getElementById('cpuFill').style.width =
            `${Math.min(100, (Number(m.cpuAverageMillicoresPerPod || 0) / 250) * 100)}%`;
          document.getElementById('cpuTotalFill').style.width =
            `${Math.min(100, (cpuTotal / 1000) * 100)}%`;
          document.getElementById('memFill').style.width =
            `${Math.min(100, (Number(m.memoryAverageMiBPerPod || 0) / 220) * 100)}%`;
          document.getElementById('note').textContent =
            `${m.note} Pods measured: ${m.podsMeasured || 0}.`;
          const errs = (m.errors || []).join('\\n');
          document.getElementById('errors').textContent = errs || "None";
          const modeText = liveMode ? "LIVE" : "REPLAY";
          document.getElementById('updated').textContent =
            `${modeText} @ ${new Date(m.ts).toLocaleTimeString()}`;
          timelineInfo.textContent = `${idx + 1}/${snapshots.length} • replicas ${currentReplicas}`;
          slider.value = String(idx);
          refreshHistorySeries();
        }

        function refreshHistorySeries() {
          slider.max = String(Math.max(0, snapshots.length - 1));
          const endIdx = Number(liveMode ? snapshots.length - 1 : (slider.value || 0));
          const safeEnd = Math.max(0, Math.min(endIdx, snapshots.length - 1));
          const startIdx = Math.max(0, safeEnd - HISTORY_SIZE + 1);
          const windowSnaps = snapshots.slice(startIdx, safeEnd + 1);
          history.cpuTotal = windowSnaps.map((s) => Number(s.cpuTotalMillicores || 0));
          history.cpuAvg = windowSnaps.map((s) => Number(s.cpuAverageMillicoresPerPod || 0));
          history.memAvg = windowSnaps.map((s) => Number(s.memoryAverageMiBPerPod || 0));
          history.replicas = windowSnaps.map((s) => Number(s.hpa.currentReplicas || 0));
          drawCharts();
        }

        async function tick() {
          try {
            const res = await fetch(apiUrl, { cache: 'no-store' });
            const m = await res.json();
            m.ts = Date.now();
            snapshots.push(m);
            if (snapshots.length > HISTORY_SIZE) snapshots.shift();
            refreshHistorySeries();
            if (liveMode) {
              renderSnapshot(snapshots.length - 1);
            } else {
              renderSnapshot(Number(slider.value || 0));
            }
          } catch (e) {
            document.getElementById('errors').textContent = `dashboard error: ${e}`;
          }
        }

        liveBtn.addEventListener("click", () => setLive(true));
        prevBtn.addEventListener("click", () => {
          setLive(false);
          slider.value = String(Math.max(0, Number(slider.value || 0) - STEP_SIZE));
          renderSnapshot(Number(slider.value || 0));
        });
        nextBtn.addEventListener("click", () => {
          setLive(false);
          slider.value = String(Math.min(Math.max(0, snapshots.length - 1), Number(slider.value || 0) + STEP_SIZE));
          renderSnapshot(Number(slider.value || 0));
        });
        slider.addEventListener("input", () => {
          setLive(false);
          renderSnapshot(Number(slider.value || 0));
        });

        document.querySelectorAll('.glass-card').forEach(card => {
          card.addEventListener('mousedown', () => { card.style.transform = 'scale(0.98)'; });
          card.addEventListener('mouseup', () => { card.style.transform = 'scale(1)'; });
          card.addEventListener('mouseleave', () => { card.style.transform = 'scale(1)'; });
        });

        setInterval(tick, 2000);
        tick();
      </script>
    </body>
    </html>
    """

    class Handler(BaseHTTPRequestHandler):
      @staticmethod
      def normalize_path(path: str) -> str:
        if path.startswith("/load-dashboard"):
          stripped = path[len("/load-dashboard") :]
          return stripped or "/"
        return path

      def do_GET(self):
        if self.path == "/load-dashboard":
          self.send_response(301)
          self.send_header("Location", "/load-dashboard/")
          self.end_headers()
          return
        path = self.normalize_path(self.path)
        if path in ("/", "/index.html"):
          self.send_response(200)
          self.send_header("Content-Type", "text/html; charset=utf-8")
          self.end_headers()
          self.wfile.write(HTML.encode("utf-8"))
          return
        if path.startswith("/api/metrics"):
          body = json.dumps(collect()).encode("utf-8")
          self.send_response(200)
          self.send_header("Content-Type", "application/json")
          self.send_header("Cache-Control", "no-store")
          self.end_headers()
          self.wfile.write(body)
          return
        self.send_response(404)
        self.end_headers()

      def log_message(self, fmt, *args):
        return

    if __name__ == "__main__":
      server = HTTPServer(("", DASHBOARD_PORT), Handler)
      server.serve_forever()
