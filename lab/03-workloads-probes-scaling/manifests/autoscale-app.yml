apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscale-api
  namespace: workloads-lab
  labels:
    app: autoscale-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscale-api
  template:
    metadata:
      labels:
        app: autoscale-api
    spec:
      containers:
        - name: autoscale-api
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests:
              # Keep this small so modest loadgen traffic exceeds the 50% HPA target
              # even on constrained CI runners.
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: autoscale-api
  namespace: workloads-lab
spec:
  selector:
    app: autoscale-api
  ports:
    - name: http
      port: 80
      targetPort: 80
